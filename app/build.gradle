apply plugin: 'com.android.application'
android {
    namespace 'com.yannie.carpediem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yannie.theforge'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }

    // Stated outright rather than left to a default. Without this the plugin
    // compiles for Java 8 and warns, and on some toolchains the warning is
    // promoted to an error.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A lint complaint must never be the reason there is no app to install.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
